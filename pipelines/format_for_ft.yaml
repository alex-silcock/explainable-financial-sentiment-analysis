steps:
  - name: Mistral 7B
    docker_image: as4387/pt-plus-libs
    environment:
      HF_HOME: /app/.cache
      HF_TOKEN: "$TOKEN"
      MPLCONFIGDIR: /app/.config/matplotlib
    command: python3
    args:
      - "./new/format_for_ft.py"
      - "-r"
      - "./new/train-mistral7b/responses_cleaned.json"
      - "-o"
      - "./.datasets/.bert_mistral7b_finetune"

