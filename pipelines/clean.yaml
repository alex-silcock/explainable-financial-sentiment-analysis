      HF_HOME: /app/.cache
      HF_TOKEN: "$TOKEN"
      MPLCONFIGDIR: /app/.config/matplotlib
    command: python3
    args:
      - "./new/clean_openai.py"
      - "-r"
      - "./new/train-gpt4omini/"

  - name: DeepSeek R1 Distill Llama 8B
