steps:
  ### TRAINING ###
  - name: Mistral 7B
    docker_image: as4387/pt-plus-libs
    environment:
      HF_HOME: /app/.cache
      HF_TOKEN: "$TOKEN"
      MPLCONFIGDIR: /app/.config/matplotlib
    command: python3
    args:
      - "./new/clean.py"
      - "-r"
      - "./new/train-mistral7b/responses.json"
      - "-t"
      - "true"

  - name: Mistral 7B with input
    docker_image: as4387/pt-plus-libs
    environment:
      HF_HOME: /app/.cache
      HF_TOKEN: "$TOKEN"
      MPLCONFIGDIR: /app/.config/matplotlib
    command: python3
    args:
      - "./new/clean.py"
      - "-r"
      - "./new/train-mistral7b/responses.json"
      - "-i"
      - "true"
      - "-t"
      - "true"

  - name: Mistral 7B with sentiment
    docker_image: as4387/pt-plus-libs
    environment:
      HF_HOME: /app/.cache
      HF_TOKEN: "$TOKEN"
      MPLCONFIGDIR: /app/.config/matplotlib
