steps:
  - name: Mistral 7B
    docker_image: as4387/pt-plus-libs
    environment:
      HF_HOME: /app/.cache
      HF_TOKEN: "$TOKEN"
      MPLCONFIGDIR: /app/.config/matplotlib
    command: python3
    args:
      - "./new/fine_tune.py"
      - "-d"
      - "./.datasets/.bert_mistral7b_finetune"
      - "-m"
      - "./models/bert-mistral7b-finetune"
      - "-o"
      - "./outputs/other/bert-mistral7b-finetune.txt"

