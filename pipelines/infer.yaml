steps:
  - name: Mistral 7B
    docker_image: as4387/pt-plus-libs
    environment:
      HF_HOME: /app/.cache
      HF_TOKEN: "$TOKEN"
      MPLCONFIGDIR: /app/.config/matplotlib
    command: python3
    args:
      - "./new/infer.py"
      - "-r"
      - "./new/test-mistral7b/responses_cleaned.json"
      - "-m"
      - "./models/bert-mistral7b-finetune"

  - name: Mistral 7B with input
    docker_image: as4387/pt-plus-libs
    environment:
      HF_HOME: /app/.cache
      HF_TOKEN: "$TOKEN"
      MPLCONFIGDIR: /app/.config/matplotlib
    command: python3
    args:
      - "./new/infer.py"
      - "-r"
      - "./new/test-mistral7b/responses_with_input_cleaned.json"
      - "-i"
      - "true"
      - "-m"
      - "./models/bert_mistral7b_finetune_with_input"

  - name: Mistral 7B with sentiment
